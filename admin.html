<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Shariful</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#0f172a;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.box{background:white;color:#172033;width:100%;max-width:450px;padding:25px;border-radius:14px}h2{text-align:center;margin-bottom:15px;color:#1264d8}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccd3df;border-radius:6px}button{width:100%;padding:12px;border:0;background:#1264d8;color:white;border-radius:7px;font-weight:bold;cursor:pointer;margin-top:8px}#progress{width:100%;height:8px;background:#e0e7f1;border-radius:10px;margin-top:12px;display:none}#progress div{height:100%;background:#1264d8;width:0%}#status{font-size:13px;margin-top:10px;text-align:center}.hidden{display:none}
</style>
</head>
<body>
<div class="box">
<h2>🔒 Boss Admin</h2>
<div id="loginBox">
<input type="password" id="pass" placeholder="Password দিন">
<button onclick="login()">Login</button>
</div>
<div id="uploadBox" class="hidden">
<input type="text" id="title" placeholder="ভিডিও টাইটেল">
<input type="file" id="videoFile" accept="video/*">
<button onclick="upload()">☁️ Cloud এ আপলোড</button>
<div id="progress"><div id="fill"></div></div>
<p id="status"></p>
<button onclick="logout()" style="background:#333">Logout</button>
<a href="index.html" style="display:block;text-align:center;margin-top:12px;color:#1264d8">← Main Site</a>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
const firebaseConfig = { apiKey: "AIzaSyAtWP11UICBmkCuYNjFAhPJYgjmFDHE", authDomain: "shariful-automation.firebaseapp.com", projectId: "shariful-automation", storageBucket: "shariful-automation.firebasestorage.app", messagingSenderId: "334934399156", appId: "1:334934399156:web:47a4c55f559d8448f833a1" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);
const PASSWORD="Shariful123";
if(localStorage.getItem("isAdmin")==="true"){ showUpload(); }
window.login=()=>{ if(document.getElementById("pass").value===PASSWORD){ localStorage.setItem("isAdmin","true"); showUpload(); } else{ alert("ভুল পাসওয়ার্ড!"); } };
function showUpload(){ document.getElementById("loginBox").classList.add("hidden"); document.getElementById("uploadBox").classList.remove("hidden"); }
window.logout=()=>{ localStorage.removeItem("isAdmin"); location.reload(); };
window.upload=async()=>{
  const file=document.getElementById("videoFile").files[0]; const title=document.getElementById("title").value||"Shariful Video";
  if(!file){ alert("ভিডিও সিলেক্ট করো!"); return; }
  const storageRef=ref(storage,"videos/"+Date.now()+"_"+file.name); const task=uploadBytesResumable(storageRef,file);
  const progress=document.getElementById("progress"); const fill=document.getElementById("fill"); const status=document.getElementById("status");
  progress.style.display="block";
  task.on("state_changed",(snap)=>{ const pr=(snap.bytesTransferred/snap.totalBytes)*100; fill.style.width=pr+"%"; status.textContent="আপলোড হচ্ছে "+Math.round(pr)+"%..."; },(err)=>{ alert(err.message); }, async()=>{
    const url=await getDownloadURL(task.snapshot.ref);
    await addDoc(collection(db,"videos"),{title:title,url:url,likes:0,createdAt:serverTimestamp()});
    status.textContent="✅ Done! Main সাইটে চলে গেছে!";
    document.getElementById("videoFile").value=""; document.getElementById("title").value="";
  });
};
</script>
</body>
</html>
